{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Church Media</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>
        :root {
            --primary: #198754;
            --primary-dark: #146c43;
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #17221c;
            --muted: #6c757d;
            --border: #dee2e6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(25, 135, 84, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(25, 135, 84, 0.08),
                    transparent 35%
                ),
                var(--bg);
            color: var(--text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            animation: fadeUp 0.5s ease;
        }

        .login-card {
            background: var(--card);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 22px;
            padding: 38px;
            box-shadow:
                0 20px 55px rgba(15, 23, 42, 0.10),
                0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            width: 88px;
            height: 88px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            overflow: hidden;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .brand h1 {
            font-size: 1.55rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .brand p {
            margin: 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .form-control {
            min-height: 48px;
            border-radius: 11px;
            border: 1px solid var(--border);
            padding: 10px 14px;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow:
                0 0 0 0.2rem rgba(25, 135, 84, 0.12);
        }

        .login-btn {
            width: 100%;
            min-height: 49px;
            border: none;
            border-radius: 11px;
            font-weight: 600;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 9px 20px rgba(25, 135, 84, 0.20);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .alert {
            border-radius: 11px;
            font-size: 0.9rem;
        }

        .system-message {
            margin-bottom: 20px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-card {
                padding: 28px 22px;
                border-radius: 18px;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #101513;
                --card: #18201c;
                --text: #edf5f0;
                --muted: #aab7b0;
                --border: #303b35;
            }

            body {
                background:
                    radial-gradient(
                        circle at top left,
                        rgba(25, 135, 84, 0.14),
                        transparent 35%
                    ),
                    radial-gradient(
                        circle at bottom right,
                        rgba(25, 135, 84, 0.08),
                        transparent 35%
                    ),
                    var(--bg);
            }

            .login-card {
                border-color: rgba(255, 255, 255, 0.07);
                box-shadow:
                    0 20px 55px rgba(0, 0, 0, 0.30);
            }

            .form-control {
                background: #111815;
                color: #edf5f0;
                border-color: var(--border);
            }

            .form-control::placeholder {
                color: #77857d;
            }

            .form-control:focus {
                background: #111815;
                color: #edf5f0;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="brand">

            <div class="brand-logo">
            <img src="{% static 'images/logo.png' %}" alt="Church Media Logo">
            </div>

            <h1>Church Media</h1>

            <p>
                Media Team Management System
            </p>

        </div>

        {% if messages %}
            <div class="system-message">

                {% for message in messages %}

                    <div
                        class="alert
                        {% if message.tags == 'error' %}
                            alert-danger
                        {% elif message.tags == 'success' %}
                            alert-success
                        {% elif message.tags == 'warning' %}
                            alert-warning
                        {% else %}
                            alert-info
                        {% endif %}
                        mb-2"
                        role="alert"
                    >
                        <i
                            class="
                            {% if message.tags == 'error' %}
                                bi bi-exclamation-circle
                            {% elif message.tags == 'success' %}
                                bi bi-check-circle
                            {% elif message.tags == 'warning' %}
                                bi bi-exclamation-triangle
                            {% else %}
                                bi bi-info-circle
                            {% endif %}
                            me-2
                            "
                        ></i>

                        {{ message }}
                    </div>

                {% endfor %}

            </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            {% if next %}
                <input
                    type="hidden"
                    name="next"
                    value="{{ next }}"
                >
            {% endif %}

            <div class="mb-3">

                <label
                    for="username"
                    class="form-label"
                >
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="username"
                    class="form-control"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>

            <div class="mb-4">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-success login-btn"
            >
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Sign In
            </button>

        </form>

        <div class="login-footer">
            Church Media Management System
        </div>

    </div>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

    <script src="{% static 'js/pwa.js' %}"></script>

</body>
</html>
