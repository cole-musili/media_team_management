{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Church Media Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(25, 135, 84, 0.18),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #07130d,
                    #0d2118 50%,
                    #07130d
                );

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 22px;
            padding: 38px;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);
            animation: slideUp 0.5s ease;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;

            background: #198754;
            color: white;

            font-size: 28px;

            box-shadow:
                0 10px 25px rgba(25, 135, 84, 0.3);
        }

        .login-title {
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
        }

        .login-subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 14px;
        }

        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.15);
        }

        .login-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(25, 135, 84, 0.25);
        }

        .login-footer {
            text-align: center;
            color: #6c757d;
            font-size: 13px;
            margin-top: 24px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="brand-icon">
            <i class="bi bi-camera-reels"></i>
        </div>

        <h2 class="login-title">
            Church Media Management
        </h2>

        <p class="login-subtitle">
            Sign in to access the media management system
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="username" class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="username"
                    class="form-control"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn btn-success login-btn"
            >
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Sign In
            </button>

        </form>

        <div class="login-footer">
            Church Media Management System
        </div>

    </div>

</div>

</body>
</html>
